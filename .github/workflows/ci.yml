name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: servers/codebase_intelligence
            package: codebase_intelligence
          - dir: servers/sql_query
            package: sql_query
          - dir: servers/issue_tracker
            package: issue_tracker
          - dir: servers/dev_environment
            package: dev_environment
          - dir: servers/knowledge_base
            package: knowledge_base
          - dir: cli
            package: mcp_toolkit
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy ${{ matrix.package }}
      - run: pytest -q
