name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: servers/codebase_intelligence
            package: codebase_intelligence
          - dir: servers/sql_query
            package: sql_query
          - dir: servers/issue_tracker
            package: issue_tracker
          - dir: servers/dev_environment
            package: dev_environment
          - dir: servers/knowledge_base
            package: knowledge_base
          - dir: servers/flutter_project_intelligence
            package: flutter_project_intelligence
          - dir: servers/flutter_ui_testing
            package: flutter_ui_testing
          - dir: servers/flutter_crash_analyzer
            package: flutter_crash_analyzer
          - dir: servers/firebase_crashlytics
            package: firebase_crashlytics
          - dir: servers/flutter_architecture_guardian
            package: flutter_architecture_guardian
          - dir: servers/flutter_dependency_manager
            package: flutter_dependency_manager
          - dir: servers/mobile_security
            package: mobile_security
          - dir: servers/api_contract
            package: api_contract
          - dir: servers/flutter_test_coverage
            package: flutter_test_coverage
          - dir: servers/flutter_performance
            package: flutter_performance
          - dir: servers/mobile_cicd
            package: mobile_cicd
          - dir: servers/flutter_code_migration
            package: flutter_code_migration
          - dir: cli
            package: mcp_toolkit
          - dir: gateway
            package: mcp_gateway
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy ${{ matrix.package }}
      - run: pytest -q
