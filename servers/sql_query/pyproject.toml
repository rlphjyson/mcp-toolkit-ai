[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-query-mcp"
version = "0.1.0"
description = "MCP server: safe, read-only SQL querying with schema introspection"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1",
    "sqlalchemy>=2.0",
    "sqlparse>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["sql_query"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
