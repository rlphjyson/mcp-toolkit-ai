[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flutter-project-intelligence-mcp"
version = "0.1.0"
description = "MCP server: navigates a Flutter codebase -- widgets, BLoC/Riverpod state, routes, repositories, dependencies"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["flutter_project_intelligence"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
